keys_file: keys.yaml

experiment:
  id: cybersecurity-run-B-local
  storage_folder: Runs

models:
  - name: llama3-8b
    interface: ollama
    parameters:
      model: llama3:8b
    roles: [teacher, student, judge]

  - name: gemma2-2b
    interface: ollama
    parameters:
      model: gemma2:2b
    roles: [teacher, student, judge]

  - name: qwen2.5-3b
    interface: ollama
    parameters:
      model: qwen2.5:3b
    roles: [teacher, student, judge]

  - name: phi3
    interface: ollama
    parameters:
      model: phi3
    roles: [teacher, student, judge]

tasks:
  - name: cybersecurity
    description: >
      Cybersecurity knowledge and reasoning assessment.
      Given a cybersecurity scenario, concept, or technical question,
      the model must provide accurate, technically sound answers covering
      topics such as network attacks, web vulnerabilities, cryptographic
      concepts, malware behavior, and defensive security practices.
      Responses should demonstrate both theoretical understanding and
      practical reasoning ability.
    output_description: >
      A clear, structured response of 2-5 sentences that accurately
      addresses the cybersecurity question with correct technical
      terminology and practical insight.
    target_attributes: auto
    nuanced_attributes: auto
    rubric: auto
    sampling:
      target: [1, 2]
      nuance: [1]
      total: 12
